<!doctype html>
<html lang="en" data-cherry-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f12" />
  <title>PetalDeck</title>
  <link rel="icon" href="/brand/petaldeck-icon.png" />
</head>
<body>
  <header class="top">
    <h1>PetalDeck</h1>
    <span id="walletChip" class="chip chip-off">No wallet</span>
  </header>

  <main class="form" id="form">
    <label class="upload" id="upload" for="image">
      <input id="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp" class="sr-only" />
      <img id="imagePreview" alt="" hidden />
      <span class="upload-empty" id="uploadEmpty">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
        <strong>Add image</strong>
        <span>PNG, JPG, GIF or WebP · up to 15 MB</span>
      </span>
      <span class="upload-change" id="uploadChange" hidden>Change</span>
    </label>
    <p class="err" data-err="image"></p>

    <div class="field">
      <label for="name">Name</label>
      <input id="name" autocomplete="off" maxlength="32" placeholder="Cherry Blossom" />
      <p class="err" data-err="name"></p>
    </div>

    <div class="field">
      <label for="ticker">Ticker</label>
      <div class="affix"><span class="prefix">$</span><input id="ticker" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="13" placeholder="PETAL" /></div>
      <p class="err" data-err="ticker"></p>
    </div>

    <div class="field">
      <label for="description">Description <span class="opt">optional</span></label>
      <textarea id="description" rows="3" maxlength="500" placeholder="What's the coin about?"></textarea>
      <p class="err" data-err="description"></p>
    </div>

    <details class="fold">
      <summary>More options</summary>
      <div class="fold-body">
        <div class="field">
          <label for="website">Website</label>
          <input id="website" type="url" inputmode="url" autocomplete="off" placeholder="https://" />
          <p class="err" data-err="website"></p>
        </div>
        <div class="field">
          <label for="x">X</label>
          <input id="x" type="url" inputmode="url" autocomplete="off" placeholder="https://x.com/…" />
          <p class="err" data-err="x"></p>
        </div>
        <div class="field">
          <label for="telegram">Telegram</label>
          <input id="telegram" type="url" inputmode="url" autocomplete="off" placeholder="https://t.me/…" />
          <p class="err" data-err="telegram"></p>
        </div>
      </div>
    </details>

    <div class="field">
      <span class="label" id="pairLabel">Pair</span>
      <div class="segmented" role="radiogroup" aria-labelledby="pairLabel">
        <button type="button" role="radio" data-pair="SOL" aria-checked="true">SOL</button>
        <button type="button" role="radio" data-pair="USDC" aria-checked="false">USDC</button>
        <button type="button" role="radio" data-pair="CUSTOM" aria-checked="false">Custom</button>
      </div>
      <div class="field sub" id="customMintField" hidden>
        <label for="customMint">Pair token mint</label>
        <input id="customMint" autocomplete="off" spellcheck="false" placeholder="Paste a mint address" />
        <p class="err" data-err="customMint"></p>
      </div>
    </div>

    <div class="field">
      <label for="initialBuy">Initial buy <span class="opt">optional</span></label>
      <div class="affix"><input id="initialBuy" inputmode="decimal" autocomplete="off" placeholder="0" /><span class="suffix" id="buyUnit">SOL</span></div>
      <div class="chips" id="buyChips"></div>
      <p class="err" data-err="initialBuy"></p>
    </div>

    <details class="fold">
      <summary>Advanced</summary>
      <div class="fold-body">
        <label class="switch-row" for="mayhem">
          <span><span class="row-title">Mayhem mode</span><span class="hint" id="mayhemHint">SOL or USDC pairs only.</span></span>
          <input id="mayhem" type="checkbox" role="switch" class="switch" />
        </label>
        <p class="err" data-err="mayhem"></p>
        <div class="field" id="creatorFeeField">
          <label for="creatorFeePct">Creator fee</label>
          <div class="affix"><input id="creatorFeePct" inputmode="decimal" autocomplete="off" placeholder="Pump default" /><span class="suffix">%</span></div>
          <p class="hint" id="creatorFeeHint"></p>
          <p class="err" data-err="creatorFeePct"></p>
        </div>
      </div>
    </details>

    <p class="fee-line" id="feeLine"></p>

    <footer class="legal">
      Unofficial. Not affiliated with Pump.fun. ·
      <a href="https://portal.cherry.fun/legal/app_b22266243fde/52e41534-4c7b-4237-9a16-ec8ea7a3c9dc/terms" target="_blank" rel="noopener">Terms</a> ·
      <a href="https://portal.cherry.fun/legal/app_b22266243fde/52e41534-4c7b-4237-9a16-ec8ea7a3c9dc/privacy" target="_blank" rel="noopener">Privacy</a>
    </footer>
  </main>

  <div class="bottom-bar">
    <button id="create" class="primary" type="button" disabled>Create coin</button>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="grabber" aria-hidden="true"></div>
      <div class="coin">
        <img id="sheetImage" alt="" />
        <div><h2 id="sheetTitle"></h2><p id="sheetTicker" class="muted"></p></div>
      </div>
      <dl class="rows">
        <div><dt>Pair</dt><dd id="sheetPair"></dd></div>
        <div><dt>Initial buy</dt><dd id="sheetBuy"></dd></div>
        <div><dt>Est. total cost</dt><dd id="sheetCost"></dd></div>
        <div><dt>Creator fees</dt><dd id="sheetFees"></dd></div>
      </dl>
      <p class="hint" id="sheetNote"></p>
      <p class="hint" id="sheetDryRun" hidden>Dry run: Cherry signs, nothing is sent, no SOL moves.</p>
      <button id="sign" class="primary" type="button">Sign in Cherry</button>
      <button class="ghost" type="button" data-close>Cancel</button>
    </section>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
